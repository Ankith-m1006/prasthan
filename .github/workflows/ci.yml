name: ci
on:
  push:
  pull_request:
env:
  MOCK_ALL: "1"
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: services/api
      - run: npm run check
        working-directory: services/api
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - run: npm run typecheck && npm test
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_APP_MOCK: "1"
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: stage scripts load and print help (no deps)
        run: |
          node infra/load/rush.mjs --help
          node scripts/demo-break.mjs --help
          node scripts/demo-fix.mjs --help
          node scripts/demo-reset.mjs --help
      - name: scripts package tests (if Session C added scripts/package.json)
        run: if [ -f scripts/package.json ]; then cd scripts && npm ci --no-audit --no-fund && npm test --if-present; fi
